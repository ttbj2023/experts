# 商务报告模板
# 适用于：商业计划书、项目报告、企业文档、提案
# 特点：专业配色、清晰层级、表格突出、品牌化设计

template_name: "商务报告"
template_description: "专业商务风格，Calibre + 黑体，深蓝色主题，表格和图表突出，适合商业文档"
template_version: "1.0.0"
template_author: "Claude Doc Processor"

# 样式配置
styles:
  # 字体配置
  fonts:
    default: "黑体"  # 中文默认字体
    western: "Calibri"  # 西文默认字体（现代商务风格）
    heading: "黑体"
    heading_western: "Calibri"
    code: "Consolas"

  # 字号配置
  font_sizes:
    body: 11  # 正文
    heading1: 20  # 一级标题（文档标题）
    heading2: 16  # 二级标题（章标题）
    heading3: 14  # 三级标题
    heading4: 13  # 四级标题
    heading5: 11  # 五级标题
    heading6: 11  # 六级标题
    caption: 10  # 图表标题
    footnote: 9

  # 行距和间距
  spacing:
    line_height: 1.4  # 1.4倍行距（紧凑但不拥挤）
    paragraph_spacing_before: 6  # 段前间距
    paragraph_spacing_after: 6  # 段后间距
    heading_spacing_before: 12  # 标题前间距
    heading_spacing_after: 6  # 标题后间距

  # 颜色配置（商务主题）
  colors:
    text: "#333333"  # 深灰（不是纯黑，更柔和）
    heading: "#2E5090"  # 企业蓝色（标题）
    link: "#2E5090"  # 链接使用企业蓝色
    table_border: "#4472C4"  # 表格边框蓝色
    table_header_bg: "#D9E2F3"  # 表头背景浅蓝
    emphasis: "#2E5090"  # 强调色（品牌蓝）
    highlight: "#FFF000"  # 高亮色

# 页面布局
layout:
  page_size: "A4"
  margins:
    top: "2.0cm"
    bottom: "2.0cm"
    left: "2.5cm"
    right: "2.0cm"

  # 段落设置
  paragraph:
    first_line_indent: "0em"  # 商务文档通常不首行缩进
    text_align: "left"  # 左对齐
    widow_orphan_control: true

# 标题样式
headings:
  h1:  # 文档标题
    font_size: 20
    font_weight: "bold"
    text_align: "center"
    color: "#2E5090"  # 企业蓝色
    margin_top: 24
    margin_bottom: 18
    page_break_before: true
    border_bottom: "3pt solid #2E5090"  # 标题下粗线

  h2:  # 章标题
    font_size: 16
    font_weight: "bold"
    text_align: "left"
    color: "#2E5090"
    margin_top: 18
    margin_bottom: 9
    border_bottom: "2pt solid #4472C4"  # 标题下蓝线
    numbering: true  # 自动编号（1, 2, 3）

  h3:  # 节标题
    font_size: 14
    font_weight: "bold"
    text_align: "left"
    color: "#2E5090"
    margin_top: 12
    margin_bottom: 6
    numbering: true

  h4:
    font_size: 13
    font_weight: "bold"
    color: "#2E5090"
    margin_top: 12
    margin_bottom: 6

  h5:
    font_size: 11
    font_weight: "bold"
    color: "#2E5090"
    margin_top: 12
    margin_bottom: 6

  h6:
    font_size: 11
    font_weight: "normal"
    color: "#333333"
    margin_top: 12
    margin_bottom: 6

# 表格样式
tables:
  border_collapse: true
  border_width: 1  # 边框稍粗（商务风格）
  border_style: "solid"
  border_color: "#4472C4"  # 蓝色边框
  cell_padding: 5  # 单元格内边距较大

  # 表题样式
  caption:
    position: "above"
    text_align: "left"
    font_size: 11
    font_weight: "bold"
    color: "#2E5090"
    numbering: true

  # 商务表格样式（全边框）
  style: "full_grid"  # full_grid | three_line
  header_row:
    background_color: "#D9E2F3"  # 表头浅蓝色背景
    font_weight: "bold"
    color: "#000000"
    border_bottom: "2pt solid #2E5090"  # 表头底部深蓝粗线

  # 斑马纹行（提高可读性）
  zebra_striping: true
  zebra_color: "#E8F0FE"

# 图片样式
images:
  max_width: "90%"
  align: "center"

  # 图题样式
  caption:
    position: "below"
    text_align: "center"
    font_size: 10
    font_weight: "bold"
    color: "#2E5090"
    numbering: true

  embedding: "base64"
  max_dimension: 1920
  quality: 90  # 商务文档标准质量

# 公式样式
formulas:
  format: "script"
  numbering: false  # 商务文档通常不需要公式编号

# 列表样式
lists:
  ordered:
    style: "arabic"
    indent: 1.5

  unordered:
    marker: "disc"
    marker_color: "#2E5090"  # 蓝色项目符号
    indent: 1.5

  spacing:
    between_items: 3  # 列表项之间有间距
    after_list: 6

# 代码块样式
code_blocks:
  font_family: "Consolas"
  font_size: 9
  background_color: "#E8F0FE"  # 浅蓝色背景（商务风格）
  border: "1pt solid #4472C4"
  border_color: "#4472C4"
  padding: 8
  line_height: 1.2
  wrap: false

# 引用样式
blockquotes:
  font_style: "normal"
  left_indent: "1.5em"
  right_indent: "0"
  border_left: "4pt solid #2E5090"  # 蓝色左边框
  background_color: "#F5F9FF"  # 极浅蓝背景
  padding_left: 12
  padding_top: 6
  padding_bottom: 6

# 强调样式
emphasis:
  bold:
    color: "#2E5090"  # 粗体文字用蓝色
  highlight:
    background_color: "#FFF000"  # 黄色高亮

# 功能开关
features:
  enable_columns: true  # 商务文档可能使用多栏
  enable_tables: true
  enable_lists: true
  enable_code_blocks: true
  enable_blockquotes: true
  enable_horizontal_rules: true

# 高级功能
advanced:
  # 封面页
  cover_page:
    enable: true
    title:
      font_size: 28
      font_weight: "bold"
      color: "#2E5090"
      align: "center"
      margin_top: 8  # 距离顶部8cm
    subtitle:
      font_size: 16
      color: "#666666"
      align: "center"
    metadata:
      font_size: 11
      align: "center"
      margin_top: 3

  # 执行摘要
  executive_summary:
    enable: true
    title: "执行摘要"
    background_color: "#F5F9FF"
    border: "1pt solid #4472C4"
    padding: 12

  # 目录
  table_of_contents:
    enable: true
    max_level: 2  # 两级目录
    title: "目录"
    font_size: 14
    font_weight: "bold"
    color: "#2E5090"

  # 图表目录
  list_of_figures:
    enable: true
    title: "图表目录"
    list_of_tables:
      enable: true
      title: "表格目录"

# 页眉页脚（商务风格）
header_footer:
  header:
    enable: true
    text: "{title} | {date}"
    font_size: 9
    color: "#666666"
    border_bottom: "1pt solid #CCCCCC"

  footer:
    enable: true
    text: "第 {page} 页 / 共 {numpages} 页"
    font_size: 9
    color: "#666666"
    align: "center"

# 输出选项
output:
  include_mathjax: false  # 商务文档通常不需要公式渲染
  pretty_print: true
  encoding: "utf-8"

# 元数据
metadata:
  # 商务文档默认元数据
  title: ""
  company: ""
  department: ""
  author: ""
  date: ""
  version: ""
  confidentiality: ""  # 机密级别
  project_code: ""  # 项目编号
