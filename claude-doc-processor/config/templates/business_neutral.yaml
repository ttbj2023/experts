# 中性灰调商务模板
# 适用于：通用商务文档、咨询报告、企业内部文档、专业报告
# 特点：中性灰色调、专业客观、低调优雅、适合任何行业

template_name: "中性灰调商务"
template_description: "中性灰色调，专业客观风格，适合通用商务文档和专业报告"
template_version: "1.0.0"
template_author: "Claude Doc Processor"

# 样式配置
styles:
  # 字体配置（专业中性）
  fonts:
    default: "思源黑体"  # 无衬线（专业）
    western: "Helvetica"  # 经典专业字体
    heading: "思源黑体"
    heading_western: "Helvetica Neue"
    code: "Monaco"

  # 字号配置（标准商务）
  font_sizes:
    body: 11
    heading1: 24
    heading2: 18
    heading3: 15
    heading4: 13
    heading5: 11
    heading6: 11
    caption: 10
    footnote: 9

  # 行距和间距（标准）
  spacing:
    line_height: 1.5
    paragraph_spacing_before: 6
    paragraph_spacing_after: 6
    heading_spacing_before: 12
    heading_spacing_after: 6

  # 颜色配置（中性灰调）
  colors:
    text: "#212121"  # 深灰黑
    heading: "#424242"  # 深灰
    link: "#1976D2"  # 标准蓝链接
    table_border: "#BDBDBD"  # 中灰边框
    table_header_bg: "#F5F5F5"  # 浅灰背景
    emphasis: "#424242"
    highlight: "#FFF9C4"  # 淡黄高亮

# 页面布局
layout:
  page_size: "A4"
  margins:
    top: "2.54cm"
    bottom: "2.54cm"
    left: "2.54cm"
    right: "2.54cm"

  # 段落设置
  paragraph:
    first_line_indent: "0em"
    text_align: "justify"

# 标题样式（专业中性）
headings:
  h1:  # 文档标题
    font_size: 24
    font_weight: "bold"
    text_align: "center"
    color: "#212121"
    margin_top: 30
    margin_bottom: 18
    page_break_before: false
    border_bottom: "2pt solid #424242"  # 深灰底线

  h2:  # 章标题
    font_size: 18
    font_weight: "bold"
    text_align: "left"
    color: "#424242"
    margin_top: 18
    margin_bottom: 10
    border_bottom: "1pt solid #BDBDBD"  # 中灰底线
    numbering: true

  h3:  # 节标题
    font_size: 15
    font_weight: "bold"
    text_align: "left"
    color: "#616161"  # 中灰
    margin_top: 14
    margin_bottom: 8
    numbering: true

  h4:
    font_size: 13
    font_weight: "bold"
    color: "#616161"
    margin_top: 12
    margin_bottom: 6

  h5:
    font_size: 11
    font_weight: "bold"
    color: "#757575"
    margin_top: 12
    margin_bottom: 6

  h6:
    font_size: 11
    font_weight: "normal"
    color: "#9E9E9E"  # 浅灰
    margin_top: 10
    margin_bottom: 6

# 表格样式（专业）
tables:
  border_collapse: true
  border_width: 0.75
  border_style: "solid"
  border_color: "#BDBDBD"  # 中灰边框
  cell_padding: 5

  # 表题样式
  caption:
    position: "above"
    text_align: "left"
    font_size: 10
    font_weight: "bold"
    color: "#424242"
    numbering: true
    margin_bottom: 6

  # 专业表格样式
  style: "full_grid"
  header_row:
    background_color: "#F5F5F5"  # 浅灰背景
    font_weight: "bold"
    color: "#212121"
    border_bottom: "1.5pt solid #757575"

  # 斑马纹（灰色系）
  zebra_striping: true
  zebra_color: "#FAFAFA"  # 极浅灰

# 图片样式
images:
  max_width: "85%"
  align: "center"

  # 图题样式
  caption:
    position: "below"
    text_align: "center"
    font_size: 9
    font_weight: "normal"
    color: "#616161"
    numbering: true

  embedding: "base64"
  max_dimension: 1920
  quality: 90

  # 灰色边框
  border: "1pt solid #E0E0E0"
  padding: 6

# 公式样式
formulas:
  format: "script"
  numbering: false

# 列表样式
lists:
  ordered:
    style: "arabic"
    indent: 1.5

  unordered:
    marker: "disc"
    marker_color: "#757575"  # 中灰项目符号
    indent: 1.5

  spacing:
    between_items: 3
    after_list: 6

# 代码块样式（专业）
code_blocks:
  font_family: "Monaco, Consolas"
  font_size: 9
  background_color: "#F5F5F5"  # 浅灰背景
  border: "1pt solid #E0E0E0"  # 浅灰边框
  padding: 10
  line_height: 1.3

# 引用样式（专业）
blockquotes:
  font_style: "normal"
  left_indent: "1.5em"
  right_indent: "0"
  border_left: "3pt solid #9E9E9E"  # 中灰左边框
  background_color: "#FAFAFA"  # 极浅灰背景
  padding_left: 12
  font_color: "#616161"

# 强调样式
emphasis:
  bold:
    color: "#212121"
    font_weight: "bold"
  italic:
    color: "#616161"
  highlight:
    background_color: "#FFF9C4"  # 淡黄高亮
    color: "#212121"

# 功能开关
features:
  enable_columns: true
  enable_tables: true
  enable_lists: true
  enable_code_blocks: true
  enable_blockquotes: true
  enable_horizontal_rules: true

# 高级功能
advanced:
  # 封面页（专业中性）
  cover_page:
    enable: true
    background_color: "#FAFAFA"  # 极浅灰背景
    title:
      font_size: 28
      font_weight: "bold"
      color: "#212121"
      align: "center"
      margin_top: 8
    subtitle:
      font_size: 14
      color: "#616161"
      align: "center"
    metadata:
      font_size: 10
      color: "#757575"
      align: "center"
      margin_top: 3

  # 执行摘要（专业）
  executive_summary:
    enable: true
    title: "摘要"
    background_color: "#F5F5F5"
    border: "1pt solid #E0E0E0"
    padding: 12

  # 信息框（中性）
  info_boxes:
    enable: true
    background_color: "#E3F2FD"  # 极浅蓝
    border: "1pt solid #90CAF9"
    padding: 10

# 页眉页脚（专业）
header_footer:
  header:
    enable: true
    text: "{title} | {company}"
    font_size: 8
    color: "#757575"
    border_bottom: "1pt solid #E0E0E0"

  footer:
    enable: true
    text: "第 {page} 页"
    font_size: 8
    color: "#9E9E9E"
    align: "center"

# 输出选项
output:
  include_mathjax: false
  pretty_print: true
  encoding: "utf-8"

# 元数据
metadata:
  title: ""
  company: ""
  department: ""
  author: ""
  date: ""
  version: ""
  reference: ""  # 参考编号
