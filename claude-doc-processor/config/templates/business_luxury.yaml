# 黑金轻奢商务模板
# 适用于：奢侈品行业、高端商业计划书、投资报告、品牌提案
# 特点：黑金配色、经典优雅、高级感、品牌化设计

template_name: "黑金轻奢商务"
template_description: "黑金配色方案，经典优雅风格，适合奢侈品、投资、高端商务场景"
template_version: "1.0.0"
template_author: "Claude Doc Processor"

# 样式配置
styles:
  # 字体配置（经典优雅）
  fonts:
    default: "思源宋体"  # 衬线字体（经典感）
    western: "Garamond"  # 经典英文字体
    heading: "思源宋体"
    heading_western: "Bodoni"  # 时尚衬线体
    code: "Courier New"

  # 字号配置（经典商务）
  font_sizes:
    body: 11
    heading1: 28  # 大标题
    heading2: 20
    heading3: 16
    heading4: 14
    heading5: 12
    heading6: 11
    caption: 10
    footnote: 9

  # 行距和间距
  spacing:
    line_height: 1.5
    paragraph_spacing_before: 8
    paragraph_spacing_after: 8
    heading_spacing_before: 16
    heading_spacing_after: 8

  # 颜色配置（黑金配色）
  colors:
    text: "#2C2C2C"  # 深灰（非纯黑，更优雅）
    heading: "#1A1A1A"  # 近黑
    link: "#B8860B"  # 暗金色链接
    table_border: "#D4AF37"  # 金色边框
    table_header_bg: "#1A1A1A"  # 黑色表头
    table_header_text: "#D4AF37"  # 表头金色文字
    emphasis: "#B8860B"
    highlight: "#FFF8DC"  # 柔和金色高亮

# 页面布局
layout:
  page_size: "A4"
  margins:
    top: "2.5cm"
    bottom: "2.5cm"
    left: "3.0cm"  # 左边距稍大（高级感）
    right: "2.5cm"

  # 段落设置
  paragraph:
    first_line_indent: "0em"
    text_align: "justify"  # 两端对齐（经典）

# 标题样式（优雅）
headings:
  h1:  # 文档标题
    font_size: 28
    font_weight: "bold"
    text_align: "center"
    color: "#1A1A1A"
    margin_top: 36
    margin_bottom: 24
    page_break_before: false
    border_bottom: "3pt double #D4AF37"  # 金色双线

  h2:  # 章标题
    font_size: 20
    font_weight: "bold"
    text_align: "left"
    color: "#1A1A1A"
    margin_top: 24
    margin_bottom: 12
    border_bottom: "2pt solid #D4AF37"  # 金色单线
    numbering: true
    numbering_style: "roman"  # 罗马数字（I, II, III）

  h3:  # 节标题
    font_size: 16
    font_weight: "bold"
    text_align: "left"
    color: "#2C2C2C"
    margin_top: 18
    margin_bottom: 10
    numbering: true

  h4:
    font_size: 14
    font_weight: "bold"
    color: "#2C2C2C"
    margin_top: 16
    margin_bottom: 8

  h5:
    font_size: 12
    font_weight: "bold"
    color: "#2C2C2C"
    margin_top: 14
    margin_bottom: 6

  h6:
    font_size: 11
    font_weight: "normal"
    color: "#666666"
    margin_top: 12
    margin_bottom: 6

# 表格样式（优雅）
tables:
  border_collapse: true
  border_width: 1.5  # 较粗边框（高级感）
  border_style: "solid"
  border_color: "#D4AF37"  # 金色边框
  cell_padding: 6

  # 表题样式
  caption:
    position: "above"
    text_align: "center"
    font_size: 12
    font_weight: "bold"
    color: "#1A1A1A"
    numbering: true
    margin_bottom: 10

  # 优雅表格样式
  style: "full_grid"
  header_row:
    background_color: "#1A1A1A"  # 黑色表头
    font_weight: "bold"
    color: "#D4AF37"  # 金色文字
    border_bottom: "3pt solid #D4AF37"

  # 斑马纹（金色系）
  zebra_striping: true
  zebra_color: "#FFF8DC"  # 柔和金色

# 图片样式
images:
  max_width: "85%"
  align: "center"

  # 图题样式
  caption:
    position: "below"
    text_align: "center"
    font_size: 10
    font_weight: "bold"
    color: "#1A1A1A"
    numbering: true

  embedding: "base64"
  max_dimension: 1920
  quality: 95

  # 金色边框
  border: "3pt solid #D4AF37"
  padding: 8

# 公式样式
formulas:
  format: "script"
  numbering: true  # 学术风格编号

# 列表样式
lists:
  ordered:
    style: "roman"  # 罗马数字（经典）
    indent: 1.5

  unordered:
    marker: "square"  # 方形项目符号
    marker_color: "#B8860B"  # 暗金色
    indent: 1.5

  spacing:
    between_items: 4
    after_list: 8

# 代码块样式（优雅）
code_blocks:
  font_family: "Courier New"
  font_size: 10
  background_color: "#FFF8DC"  # 柔和金色背景
  border: "1pt solid #D4AF37"  # 金色边框
  padding: 10
  line_height: 1.3

# 引用样式（优雅）
blockquotes:
  font_style: "italic"
  left_indent: "2em"
  right_indent: "1em"
  border_left: "4pt solid #B8860B"  # 暗金色左边框
  background_color: "#FFF8DC"  # 柔和金色背景
  padding_left: 16
  padding_top: 8
  padding_bottom: 8
  font_color: "#2C2C2C"

# 强调样式
emphasis:
  bold:
    color: "#1A1A1A"
    font_weight: "bold"
  italic:
    color: "#B8860B"  # 斜体用金色
    font_style: "italic"
  highlight:
    background_color: "#FFEC8B"  # 明亮金色高亮
    color: "#1A1A1A"

# 功能开关
features:
  enable_columns: true
  enable_tables: true
  enable_lists: true
  enable_code_blocks: true
  enable_blockquotes: true
  enable_horizontal_rules: true

# 高级功能
advanced:
  # 封面页（奢华）
  cover_page:
    enable: true
    background_color: "#1A1A1A"  # 黑色背景
    title:
      font_size: 36
      font_weight: "bold"
      color: "#D4AF37"  # 金色标题
      align: "center"
      margin_top: 8
    subtitle:
      font_size: 16
      color: "#FFFFFF"  # 白色副标题
      align: "center"
    metadata:
      font_size: 11
      color: "#D4AF37"
      align: "center"
      margin_top: 4

  # 金色装饰线
  decorative_lines:
    enable: true
    color: "#D4AF37"
    width: 2
    style: "solid"

  # 品牌标识位置
  brand_logo:
    enable: true
    position: "top_center"
    max_width: "3cm"

# 页眉页脚（奢华）
header_footer:
  header:
    enable: true
    text: "{title} | {company}"
    font_size: 9
    color: "#B8860B"  # 暗金色
    border_bottom: "1pt solid #D4AF37"  # 金色底线

  footer:
    enable: true
    text: "第 {page} 页 | © {year} {company}"
    font_size: 9
    color: "#666666"
    align: "center"

# 输出选项
output:
  include_mathjax: false
  pretty_print: true
  encoding: "utf-8"

# 元数据
metadata:
  title: ""
  company: ""
  author: ""
  date: ""
  version: ""
  confidentiality: "机密"  # 默认机密级别
  project_code: ""
