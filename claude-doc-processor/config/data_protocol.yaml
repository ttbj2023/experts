# 数据流转协议定义
# 定义画框→识别→填空三个模块之间的JSON数据交换格式

# 协议版本
protocol_version: "1.0.0"

# ============================================================================
# 阶段1：画框模块输出（Layout Analyzer → Content Extractor）
# ============================================================================
layout_analysis_output:
  description: "版面分析模块的输出格式，包含页面所有元素的位置和类型信息"
  file_format: "page_layout_{page_number:04d}.json"

  schema:
    # 文档元数据
    document_info:
      source_file: "string"  # 源PDF文件路径
      total_pages: "integer"  # 总页数
      processed_page: "integer"  # 当前处理页码（从1开始）
      processing_timestamp: "string"  # ISO 8601格式时间戳

    # 页面信息
    page_info:
      page_id: "string"  # 页面唯一标识（如 "page_001"）
      page_number: "integer"  # 页码（从1开始）
      page_size:
        width: "number"  # 页面宽度（像素）
        height: "number"  # 页面高度（像素）
        unit: "string"  # 单位，固定为"px"

      dpi: "integer"  # 渲染DPI（推荐200）
      rotation: "integer"  # 页面旋转角度（0, 90, 180, 270）

    # 元素清单
    elements:
      - element_id: "string"  # 元素唯一标识（如 "elem_001"）
        type: "string"  # 元素类型（从element_mapping.yaml中选择）
        read_order: "integer"  # 阅读顺序（从1开始，必须连续）

        # 边界框
        bbox:
          x1: "number"  # 左上角X坐标（像素）
          y1: "number"  # 左上角Y坐标（像素）
          x2: "number"  # 右下角X坐标（像素）
          y2: "number"  # 右下角Y坐标（像素）

        # 版式属性
        layout_attr:
          cross_column: "boolean"  # 是否跨栏（用于双栏布局）
          column: "string"  # 所属栏位（"left"/"right"/"full"）
          align: "string"  # 对齐方式（"left"/"center"/"right"/"justify"）

          # 列表特有属性
          list_level: "integer"  # 列表层级（1-3，仅列表类型）
          list_type: "string"  # 列表类型（"1"/"A"/"a"/"I"/"i"/"disc"/"circle"/"square"）
          start_num: "integer"  # 起始编号（仅有序列表，默认1）

          # 表格特有属性
          table_rows: "integer"  # 表格行数（仅表格类型）
          table_cols: "integer"  # 表格列数（仅表格类型）
          has_header: "boolean"  # 是否有表头（仅表格类型）

        # 置信度（可选，用于质量评估）
        confidence:
          type_detection: "number"  # 类型识别置信度（0-1）
          bbox_accuracy: "number"  # 边界框准确度（0-1）

        # 附加信息
        metadata:
          area: "number"  # 元素面积（像素²）
          aspect_ratio: "number"  # 宽高比
          position: "string"  # 页面位置（"top"/"middle"/"bottom"）

    # 全局布局信息
    layout_info:
      column_count: "integer"  # 栏数（1或2）
      column_width: "number"  # 单栏宽度（像素）
      column_gap: "number"  # 栏间距（像素）

      has_header: "boolean"  # 是否有页眉
      has_footer: "boolean"  # 是否有页脚

      main_content_area:
        x1: "number"  # 主内容区域左上角X
        y1: "number"  # 主内容区域左上角Y
        x2: "number"  # 主内容区域右下角X
        y2: "number"  # 主内容区域右下角Y

    # 处理状态
    processing_status:
      success: "boolean"  # 处理是否成功
      warnings: "array"  # 警告信息列表
      errors: "array"  # 错误信息列表
      model_used: "string"  # 使用的模型名称（GLM-4.6V/Qwen3VL）

  # 示例数据
  example:
    document_info:
      source_file: "/path/to/input.pdf"
      total_pages: 10
      processed_page: 1
      processing_timestamp: "2026-02-15T10:30:00Z"

    page_info:
      page_id: "page_001"
      page_number: 1
      page_size: { width: 1240, height: 1754, unit: "px" }
      dpi: 200
      rotation: 0

    elements:
      - element_id: "elem_001"
        type: "title_h1"
        read_order: 1
        bbox: { x1: 400, y1: 80, x2: 840, y2: 120 }
        layout_attr: { cross_column: true, column: "full", align: "center" }
        confidence: { type_detection: 0.98, bbox_accuracy: 0.95 }
        metadata: { area: 17600, aspect_ratio: 4.0, position: "top" }

      - element_id: "elem_002"
        type: "ordered_list"
        read_order: 2
        bbox: { x1: 220, y1: 170, x2: 1020, y2: 300 }
        layout_attr:
          cross_column: false
          column: "left"
          align: "left"
          list_level: 1
          list_type: "1"
          start_num: 1

# ============================================================================
# 阶段2：识别模块输出（Content Extractor → HTML Generator）
# ============================================================================
content_extraction_output:
  description: "内容提取模块的输出格式，在版面分析基础上填充元素内容"
  file_format: "page_content_{page_number:04d}.json"

  schema:
    # 继承版面分析的所有字段
    base_fields: "inherit_from_layout_analysis"

    # 扩展：元素内容（每个元素增加content相关字段）
    elements:
      - # ... 继承layout_analysis_output.elements的所有字段 ...

        # 文本类元素内容
        content: "string"  # 纯文本内容（标题/段落/列表项）

        # 公式类元素内容
        latex_code: "string"  # LaTeX源码（公式类型）
        formula_alt: "string"  # 公式替代文本（用于alt属性）

        # 表格类元素内容
        table_data:
          headers: "array"  # 表头内容（字符串数组）
          rows:
            - cells: "array"  # 单元格内容数组
              merged_cells:
                - colspan: "integer"  # 横向合并列数
                  rowspan: "integer"  # 纵向合并行数
                  cell_index: "integer"  # 合并起始单元格索引

          table_style:
            border_width: "string"  # 边框宽度（如"1pt"）
            cell_padding: "string"  # 单元格内边距（如"4pt"）

        # 图片类元素内容
        image_data:
          base64_data: "string"  # base64编码的图片数据
          format: "string"  # 图片格式（"PNG"/"JPEG"）
          width: "integer"  # 原始宽度（像素）
          height: "integer"  # 原始高度（像素）
          alt_text: "string"  # 替代文本（图片描述）

        # 列表类元素内容（嵌套结构）
        list_items:
          - item_id: "string"  # 列表项ID
            content: "string"  # 列表项内容
            child_items: "array"  # 子列表项（递归结构）

        # 图注/表注
        caption_text: "string"  # 注释文本（caption类型）

        # 提取质量指标
        extraction_quality:
          content_confidence: "number"  # 内容提取置信度（0-1）
          ocr_quality: "number"  # OCR质量（0-1，如使用了OCR）
          formatting_preserved: "boolean"  # 格式是否保留完整

    # 页面级汇总信息
    page_summary:
      total_elements: "integer"  # 总元素数
      element_type_counts: "object"  # 各类型元素数量统计
      has_formulas: "boolean"  # 是否包含公式
      has_tables: "boolean"  # 是否包含表格
      has_images: "boolean"  # 是否包含图片
      word_count_estimate: "integer"  # 预估字数

    # 处理日志
    extraction_log:
      api_calls: "integer"  # API调用次数
      total_tokens: "integer"  # 总token消耗
      processing_time: "number"  # 处理耗时（秒）
      retry_count: "integer"  # 重试次数
      failed_elements: "array"  # 提取失败的元素ID列表

  example:
    # 继承page_layout的示例结构
    # 扩展content字段示例：

    elements:
      - element_id: "elem_001"
        type: "title_h1"
        read_order: 1
        bbox: { x1: 400, y1: 80, x2: 840, y2: 120 }
        layout_attr: { cross_column: true, column: "full", align: "center" }
        content: "教材问题解答"
        extraction_quality: { content_confidence: 0.99, formatting_preserved: true }

      - element_id: "elem_002"
        type: "formula_block"
        read_order: 2
        bbox: { x1: 400, y1: 150, x2: 840, y2: 200 }
        layout_attr: { cross_column: true, column: "full", align: "center" }
        latex_code: "s^2 = \\frac{1}{n}\\sum_{i=1}^n (x_i-\\overline{x})^2"
        formula_alt: "方差计算公式"
        extraction_quality: { content_confidence: 0.95, formatting_preserved: true }

      - element_id: "elem_003"
        type: "table"
        read_order: 3
        bbox: { x1: 220, y1: 250, x2: 1020, y2: 450 }
        layout_attr:
          cross_column: false
          column: "left"
          align: "center"
          table_rows: 3
          table_cols: 3
          has_header: true
        table_data:
          headers: ["组别", "平均数", "方差"]
          rows:
            - cells: ["A组", "4℃", "127.25"]
              merged_cells: []
            - cells: ["B组", "20℃", "53.1875"]
              merged_cells: []
          table_style: { border_width: "1pt", cell_padding: "4pt" }

# ============================================================================
# 阶段3：填空模块输出（HTML Generator → Final File）
# ============================================================================
html_generation_output:
  description: "HTML生成模块的输出格式，生成完整的Word兼容HTML文件"
  file_format: "final_{source_filename}_page{page_number:04d}.html"

  output_spec:
    file_encoding: "UTF-8"  # 必须使用UTF-8编码
    line_ending: "CRLF"  # Windows行尾符

  schema:
    # HTML文档结构（字符串形式）
    html_document: "string"

    # 生成元数据
    generation_metadata:
      source_json: "string"  # 源JSON文件路径
      template_version: "string"  # 使用的模板版本
      generator_version: "string"  # 生成器版本号

      generated_at: "string"  # 生成时间戳
      generated_by: "string"  # 生成器标识

      # 统计信息
      stats:
        total_html_size: "integer"  # HTML文件大小（字节）
        total_elements_rendered: "integer"  # 渲染的元素总数
        total_images_embedded: "integer"  # 嵌入的图片数量
        total_formulas: "integer"  # 公式数量
        total_tables: "integer"  # 表格数量

      # 验证结果
      validation:
        passed: "boolean"  # 是否通过合规性验证
        forbidden_tags_found: "array"  # 发现的禁用标签
        forbidden_attributes_found: "array"  # 发现的禁用属性
        external_links_found: "array"  # 发现的外部链接
        warnings: "array"  # 警告信息

  # HTML文档必须符合以下规范
  html_requirements:
    doctype: '<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">'
    charset: "UTF-8"
    style_location: "head > style"  # 样式必须在head的style标签内
    script_allowed: "MathJax only"  # 仅允许MathJax脚本

    body_structure:
      - "<div id='page-container'>"  # 页面容器
      - "  <div class='main-content'>"  # 主内容区
      - "    <!-- elements rendered here -->"
      - "  </div>"
      - "</div>"

    # 必须禁用的标签
    forbidden_tags:
      - "<section>"
      - "<article>"
      - "<header>"
      - "<footer>"
      - "<nav>"
      - "<figure>"
      - "<figcaption>"
      - "<video>"
      - "<audio>"
      - "<iframe>"
      - "<canvas>"
      - "<svg>"
      - "<template>"
      - "<form>"
      - "<input>"
      - "<select>"
      - "<button>"
      - "<textarea>"

    # 必须禁用的CSS属性
    forbidden_css:
      - "display: flex"
      - "display: grid"
      - "position: absolute"
      - "position: fixed"
      - "border-radius"
      - "box-shadow"
      - "transform"
      - "transition"
      - "opacity"
      - "rgba"
      - "hsla"
      - "linear-gradient"
      - "radial-gradient"

# ============================================================================
# 错误处理协议
# ============================================================================
error_handling:
  # 错误类型定义
  error_types:
    layout_analysis_failed:
      code: "LAYOUT_001"
      severity: "fatal"
      message: "版面分析失败"
      recovery: "降低图片质量重试，或切换备用模型"

    content_extraction_failed:
      code: "EXTRACT_001"
      severity: "partial"
      message: "部分元素内容提取失败"
      recovery: "标记失败元素，继续处理其他元素"

    html_generation_failed:
      code: "HTML_001"
      severity: "fatal"
      message: "HTML生成失败"
      recovery: "检查模板文件，修复数据格式"

    validation_failed:
      code: "VALIDATE_001"
      severity: "warning"
      message: "HTML合规性验证失败"
      recovery: "记录违规标签/属性，生成警告报告"

  # 错误响应格式
  error_response:
    success: false
    error_code: "string"
    error_message: "string"
    error_details: "object"
    timestamp: "string"
    retry_suggested: "boolean"

# ============================================================================
# 批处理协议
# ============================================================================
batch_processing:
  description: "多页PDF批处理时的数据管理"

  # 任务清单格式
  task_list:
    file_name: "batch_tasks.json"
    schema:
      jobs:
        - job_id: "string"
          input_pdf: "string"
          output_html: "string"
          page_range: "string"  # "all" 或 "1-5"

          status: "string"  # "pending"/"processing"/"completed"/"failed"
          progress: "number"  # 0-100

          started_at: "string"
          completed_at: "string"
          error_message: "string"

  # 进度跟踪格式
  progress_tracking:
    file_name: "progress_{batch_id}.json"
    schema:
      batch_id: "string"
      total_jobs: "integer"
      completed_jobs: "integer"
      failed_jobs: "integer"
      total_pages: "integer"
      processed_pages: "integer"
      estimated_time_remaining: "number"  # 秒
      current_page: "integer"

# ============================================================================
# 质量评估协议
# ============================================================================
quality_assessment:
  description: "评估转换质量的指标"

  metrics:
    layout_accuracy:
      description: "版面识别准确率"
      calculation: "正确识别的元素数 / 总元素数"
      target: ">= 0.95"

    content_integrity:
      description: "内容完整性"
      calculation: "正确提取的字符数 / 总字符数"
      target: ">= 0.98"

    formula_accuracy:
      description: "公式LaTeX化准确率"
      calculation: "正确的LaTeX公式数 / 总公式数"
      target: ">= 0.90"

    table_structure_accuracy:
      description: "表格结构准确率"
      calculation: "正确识别的表格数 / 总表格数"
      target: ">= 0.95"

    word_compatibility:
      description: "Word兼容性"
      calculation: "通过验证的HTML元素数 / 总元素数"
      target: ">= 1.00"  # 必须100%兼容

  # 质量报告格式
  quality_report:
    file_name: "quality_report_{timestamp}.json"
    schema:
      overall_score: "number"  # 0-100
      individual_scores: "object"  # 各项指标得分
      issues_found: "array"  # 发现的问题列表
      recommendations: "array"  # 改进建议
      human_review_required: "boolean"  # 是否需要人工复核
