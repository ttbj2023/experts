<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>转换生成文档</title>
    <script type="text/javascript" async
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    <style type="text/css">
        /* ==================== 全局样式 ==================== */
        body {
            font-family: '宋体', 'Times New Roman', serif;
            font-size: 10.5pt;
            line-height: 1.6;
            margin: 0;
            padding: 20pt 30pt;
        }

        /* ==================== 标题样式 ==================== */
        h1 {
            font-size: 18pt;
            font-weight: bold;
            margin: 12pt 0;
            page-break-after: avoid;
        }

        h2 {
            font-size: 16pt;
            font-weight: bold;
            margin: 10pt 0;
            page-break-after: avoid;
        }

        h3 {
            font-size: 14pt;
            font-weight: bold;
            margin: 8pt 0;
            page-break-after: avoid;
        }

        h4 {
            font-size: 12pt;
            font-weight: bold;
            margin: 6pt 0;
            page-break-after: avoid;
        }

        h5 {
            font-size: 11pt;
            font-weight: bold;
            margin: 5pt 0;
        }

        h6 {
            font-size: 10pt;
            font-weight: bold;
            margin: 4pt 0;
        }

        /* ==================== 段落样式 ==================== */
        p {
            margin: 5pt 0;
            text-indent: 2em;
        }

        p.no-indent {
            text-indent: 0;
        }

        /* ==================== 文本样式 ==================== */
        strong, b {
            font-weight: bold;
        }

        em, i {
            font-style: italic;
        }

        u {
            text-decoration: underline;
        }

        s {
            text-decoration: line-through;
        }

        sup {
            font-size: 0.7em;
            vertical-align: super;
        }

        sub {
            font-size: 0.7em;
            vertical-align: sub;
        }

        code {
            font-family: 'Courier New', monospace;
            background-color: #f5f5f5;
            padding: 2pt 4pt;
        }

        /* ==================== 列表样式 ==================== */
        ul, ol {
            margin: 5pt 0;
            padding-left: 20pt;
        }

        li {
            margin: 3pt 0;
        }

        /* 二级列表缩进 */
        ul ul, ol ol, ul ol, ol ul {
            margin: 3pt 0 3pt 15pt;
        }

        /* ==================== 表格样式 ==================== */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10pt 0;
        }

        td, th {
            border: 1px solid #000;
            padding: 4pt;
            text-align: center;
        }

        th {
            font-weight: bold;
            background-color: #f0f0f0;
        }

        /* ==================== 图片样式 ==================== */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10pt auto;
        }

        .figure {
            text-align: center;
            margin: 10pt 0;
            break-inside: avoid;
        }

        .figure-caption {
            text-align: center;
            font-size: 9.5pt;
            margin: 5pt 0;
            text-indent: 0;
        }

        /* ==================== 公式样式 ==================== */
        .formula-block {
            margin: 8pt 0;
            text-align: center;
            break-inside: avoid;
        }

        /* ==================== 代码块样式 ==================== */
        pre {
            background-color: #f5f5f5;
            padding: 10pt;
            margin: 10pt 0;
            font-family: 'Courier New', monospace;
            white-space: pre;
            break-inside: avoid;
        }

        /* ==================== 多栏布局 ==================== */
        .two-column {
            column-count: 2;
            column-gap: 24pt;
            column-rule: 1pt solid #cce0f5;
            margin: 10pt 0;
        }

        .three-column {
            column-count: 3;
            column-gap: 20pt;
            column-rule: 1pt solid #cce0f5;
            margin: 10pt 0;
        }

        /* ==================== 引用块样式 ==================== */
        blockquote {
            margin: 10pt 20pt;
            padding-left: 10pt;
            border-left: 3pt solid #ccc;
            color: #666;
        }

        /* ==================== 水平分隔线 ==================== */
        hr {
            border: none;
            border-top: 1pt solid #ccc;
            margin: 15pt 0;
        }

        /* ==================== 页面控制 ==================== */
        @page {
            size: A4;
            margin: 20pt 30pt;
        }

        /* 防止元素被拆分 */
        .no-break {
            break-inside: avoid;
        }
    </style>
</head>
<body>
<div style="break-inside: avoid;">
    <h1>数学公式测试</h1>
</div>

<div style="break-inside: avoid;">
    <h2>3.1 行内公式</h2>
</div>

<p>方差计算公式为 <script type="math/tex">s^2 = \frac{1}{n}\sum_{i=1}^n (x_i-\overline{x})^2</script>。 欧拉公式：<script type="math/tex">e^{i\pi} + 1 = 0</script>。</p>

<div style="break-inside: avoid;">
    <h2>3.2 块级公式</h2>
</div>

<p>二次方程求根公式： <script type="math/tex; mode=display">x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}</script></p>

<p>定积分示例： <script type="math/tex; mode=display">\int_{a}^{b} f(x) dx = F(b) - F(a)</script></p>

<p>矩阵示例： <script type="math/tex; mode=display">\begin{pmatrix} a & b \\ c & d \end{pmatrix}</script></p>

<p>测试完成！</p>

</body></html>
