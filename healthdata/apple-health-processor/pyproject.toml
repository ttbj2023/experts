[project]
name = "apple-health-processor"
version = "0.1.0"
description = "处理 Apple Health 导出的 XML 数据，生成健康分析所需的 CSV 汇总表"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Health Data Processor"}
]
dependencies = [
    "click>=8.4.0",
    "fastparquet>=2026.5.0",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
]

[project.scripts]
apple-health-processor = "apple_health_processor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health_processor"]
